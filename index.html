<script>
const songs=[];let current=-1,raf=0;const $=s=>document.querySelector(s), songsEl=$('#songs'),audio=new Audio();
function render(){songsEl.innerHTML=songs.map((s,i)=>`<article class="song" data-i="${i}"><img class="cover" src="${s.art||''}"><div><div class="song-title">${esc(s.title||'Unknown')}</div><div class="song-artist">${esc(s.artist||'Unknown artist')}</div></div><button class="heart" data-fav="${i}">${s.favorite?'♥':'♡'}</button></article>`).join('')}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
songsEl.onclick=e=>{const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();const i=+fav.dataset.fav;songs[i].favorite=!songs[i].favorite;render();return}const row=e.target.closest('.song');if(row)play(+row.dataset.i)};
songsEl.oncontextmenu=e=>{const row=e.target.closest('.song');if(!row)return;e.preventDefault();menu.dataset.i=row.dataset.i;menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';menu.style.display='block'};
const menu=$('#context');document.onclick=()=>menu.style.display='none';menu.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+menu.dataset.i;if(b.dataset.action==='play')play(i);if(b.dataset.action==='favorite'){songs[i].favorite=!songs[i].favorite;render()}menu.style.display='none'};
function play(i){current=i;const s=songs[i];audio.src=s.url;audio.play();$('#nowTitle').textContent=s.title||'Unknown';$('#nowArtist').textContent=s.artist||'Unknown artist';$('#nowCover').src=s.art||'';startFrame()}
$('#play').onclick=()=>audio.paused?audio.play():audio.pause();$('#shuffle').onclick=()=>{if(songs.length)play(Math.floor(Math.random()*songs.length))};$('#prev').onclick=()=>current>0&&play(current-1);$('#next').onclick=()=>current>=0&&current<songs.length-1&&play(current+1);
$('#progressWrap').onclick=e=>{if(!audio.duration)return;audio.currentTime=(e.clientX/e.currentTarget.clientWidth)*audio.duration};
function startFrame(){cancelAnimationFrame(raf);const frame=()=>{const p=audio.duration?audio.currentTime/audio.duration:0;$('#progress').style.width=(p*100)+'%';raf=requestAnimationFrame(frame)};frame()};audio.addEventListener('play',startFrame);audio.addEventListener('pause',()=>cancelAnimationFrame(raf));
// Word-level lyric renderer accepts [{start,end,words:[{text,start,end}]}] when a provider supplies timestamps.
function renderLyrics(lines){const box=$('#lyrics');box.innerHTML=lines.map((l,i)=>`<div class="lyric" data-start="${l.start}" data-end="${l.end||0}">${(l.words?l.words.map(w=>`<span class="word" data-start="${w.start}" data-end="${w.end||0}">${esc(w.text)}</span>`).join(' '):esc(l.text||''))}<i class="bar"></i></div>`).join('')}
function updateLyrics(lines){const t=audio.currentTime;let active=-1;lines.forEach((l,i)=>{if(t>=l.start&&(i===lines.length-1||t<lines[i+1].start))active=i});document.querySelectorAll('.lyric').forEach((el,i)=>{el.classList.toggle('active',i===active);if(i===active){const l=lines[i],p=Math.max(0,Math.min(1,(t-l.start)/Math.max(.01,(l.end||lines[i+1]?.start||l.start+.1)-l.start)));el.style.setProperty('--p',p);el.scrollIntoView({block:'center',behavior:'smooth'});el.querySelectorAll('.word').forEach(w=>w.classList.toggle('active',t>=+w.dataset.start&&t<+(w.dataset.end||Infinity)))}})}
</script><!-- MOMOIROBARA FLOWING LYRICS + FLOWER BACKGROUND V1 -->
<style id="momo-flowing-lyrics-bg">
#momoFlowerField{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:.72}
#momoFlowerField .momo-flower{position:absolute;width:24px;height:24px;filter:drop-shadow(0 5px 14px color-mix(in srgb,var(--a) 22%,transparent));animation:momoFlowerFloat var(--fd,18s) ease-in-out infinite alternate,momoFlowerSpin var(--fs,28s) linear infinite;will-change:transform}
#momoFlowerField .momo-petal{position:absolute;left:8px;top:1px;width:8px;height:12px;border-radius:70% 70% 55% 55%;background:color-mix(in srgb,var(--a) 68%,white);transform-origin:50% 11px;opacity:.72}
#momoFlowerField .momo-center{position:absolute;left:9px;top:9px;width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--b) 78%,white);box-shadow:0 0 12px color-mix(in srgb,var(--b) 35%,transparent)}
@keyframes momoFlowerFloat{0%{translate:0 0;opacity:.25}50%{opacity:.72}100%{translate:var(--dx,30px) var(--dy,-70px);opacity:.48}}
@keyframes momoFlowerSpin{to{rotate:360deg}}

#lyr{scroll-behavior:smooth!important;overflow-anchor:none}

#lyr .line.active{transform:scale(1.025) translateX(3px)!important;color:var(--text)!important}

#lyr .momo-word.done{color:var(--text)}

#lyr .momo-word.future{color:var(--muted)}
</style>
<script id="momo-flowing-lyrics-bg-js">
(()=>{
  'use strict';
  const audio=document.getElementById('audio'), lyr=document.getElementById('lyr');
  const parseTime=v=>{const n=Number(v);if(Number.isFinite(n))return n>1000?n/1000:n;const m=String(v||'').match(/^(?:(\d+):)?(\d+)(?:\.(\d+))?$/);return m?Number(m[1]||0)*60+Number(m[2])+Number('0.'+(m[3]||'0')):NaN};
  const parseEnhanced=l=>{const out=[];const re=/<(\d{1,3}):(\d{2})(?:\.(\d{1,3}))?>/g;let m,last=0;while((m=re.exec(l))){if(m.index>last)out.push({text:l.slice(last,m.index),time:parseTime(`${m[1]}:${m[2]}.${m[3]||'0'}`)});last=re.lastIndex}if(last<l.length)out.push({text:l.slice(last),time:NaN});return out};
  const decorate=()=>{if(!lyr)return;lyr.querySelectorAll('.line').forEach(line=>{if(line.dataset.momoWordsReady)return;const raw=line.textContent||'';const words=parseEnhanced(raw);if(words.filter(w=>Number.isFinite(w.time)).length<2)return;line.dataset.momoWordsReady='1';line.innerHTML='';words.forEach(w=>{const s=document.createElement('span');s.className='momo-word future';s.textContent=w.text;s.dataset.time=String(w.time);line.appendChild(s)})})};
  const lineTime=l=>parseTime(l?.dataset?.time||l?.dataset?.start);
  let active=-1;
  const render=()=>{if(!audio||!lyr)return;decorate();const now=audio.currentTime||0,lines=[...lyr.querySelectorAll('.line')],times=lines.map(lineTime);let next=-1;times.forEach((t,i)=>{if(Number.isFinite(t)&&t<=now+.015)next=i});if(next!==active){active=next;if(active>=0){const el=lines[active];const target=el.offsetTop-(lyr.clientHeight*.5)+(el.offsetHeight*.5);lyr.scrollTo({top:Math.max(0,target),behavior:'smooth'})}}lines.forEach((line,i)=>{const start=times[i],end=Number.isFinite(times[i+1])?times[i+1]:now+3;const p=i===active&&Number.isFinite(start)?Math.max(0,Math.min(1,(now-start)/Math.max(.05,end-start))):0;line.style.setProperty('--momo-line-progress',(p*100).toFixed(2)+'%');line.classList.toggle('active',i===active);const words=[...line.querySelectorAll('.momo-word')];if(words.length){let wi=-1;words.forEach((w,j)=>{const t=parseTime(w.dataset.time);if(Number.isFinite(t)&&t<=now+.01)wi=j});words.forEach((w,j)=>w.className='momo-word '+(j<wi?'done':j===wi?'current':'future'))}})};
  if(audio){['timeupdate','seeking','seeked','loadedmetadata'].forEach(e=>audio.addEventListener(e,render,{passive:true}));const loop=()=>{render();requestAnimationFrame(loop)};requestAnimationFrame(loop)}
  if(lyr)new MutationObserver(()=>requestAnimationFrame(decorate)).observe(lyr,{childList:true,subtree:true});
  if(!document.getElementById('momoFlowerField')){const f=document.createElement('div');f.id='momoFlowerField';for(let i=0;i<24;i++){const x=document.createElement('i');x.className='momo-flower';x.style.left=(Math.random()*100)+'%';x.style.top=(Math.random()*105)+'%';x.style.setProperty('--fd',(15+Math.random()*18)+'s');x.style.setProperty('--fs',(20+Math.random()*28)+'s');x.style.setProperty('--dx',(-80+Math.random()*160)+'px');x.style.setProperty('--dy',(-40-Math.random()*110)+'px');for(let j=0;j<6;j++){const p=document.createElement('i');p.className='momo-petal';p.style.transform=`rotate(${j*60}deg)`;x.appendChild(p)}const c=document.createElement('i');c.className='momo-center';x.appendChild(c);f.appendChild(x)}document.body.insertBefore(f,document.body.firstChild)}
})();
</script>

<script id="momo-stable-ui-repair-js">
(function(){
  'use strict';
  var audio=document.getElementById('audio');
  var lyr=document.getElementById('lyr');
  if(!document.getElementById('momoAnimatedBg')){
    var bg=document.createElement('div');bg.id='momoAnimatedBg';
    bg.innerHTML='<i class="momo-orb one"></i><i class="momo-orb two"></i><i class="momo-orb three"></i>';
    document.body.insertBefore(bg,document.body.firstChild);
  }
  function paintProgress(){
    if(!audio)return;
    var d=Number(audio.duration),p=(isFinite(d)&&d>0)?Math.max(0,Math.min(1,audio.currentTime/d)):0,pct=(p*100).toFixed(3)+'%';
    document.querySelectorAll('.player input[type="range"],.player-bar input[type="range"],.progress input[type="range"]').forEach(function(r){r.style.setProperty('--momo-progress',pct);});
  }
  if(audio){['loadedmetadata','durationchange','timeupdate','seeking','seeked'].forEach(function(n){audio.addEventListener(n,paintProgress,{passive:true});});(function frame(){paintProgress();window.requestAnimationFrame(frame);})();}
  function lyricTime(el){
    var raw=el.getAttribute('data-time')||el.getAttribute('data-start');
    if(raw===null)return NaN;
    var n=Number(raw);if(isFinite(n))return n>1000?n/1000:n;
    var m=String(raw).match(/^(?:(\d+):)?(\d+)(?:\.(\d+))?$/);
    return m?Number(m[1]||0)*60+Number(m[2])+Number('0.'+(m[3]||'0')):NaN;
  }
  function paintLyrics(){
    if(!lyr||!audio||!isFinite(audio.currentTime))return;
    var lines=Array.prototype.slice.call(lyr.querySelectorAll('.line')),times=lines.map(lyricTime),active=-1;
    times.forEach(function(t,i){if(isFinite(t)&&t<=audio.currentTime+0.01)active=i;});
    lines.forEach(function(el,index){
      var start=times[index],next=times[index+1],end=isFinite(next)?next:(isFinite(audio.duration)?audio.duration:start+3);
      var progress=(index===active&&isFinite(start))?Math.max(0,Math.min(1,(audio.currentTime-start)/Math.max(.01,end-start))):0;
      el.style.setProperty('--momo-line-progress',(progress*100).toFixed(2)+'%');el.classList.toggle('active',index===active);
    });
  }
  if(audio){['timeupdate','seeking','seeked','durationchange'].forEach(function(n){audio.addEventListener(n,paintLyrics,{passive:true});});(function frame(){paintLyrics();window.requestAnimationFrame(frame);})();}
  document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('.song .icon-btn');if(b)e.stopPropagation();},true);
  var menu=document.getElementById('momoContextMenu');
  if(!menu){menu=document.createElement('div');menu.id='momoContextMenu';menu.setAttribute('role','menu');menu.innerHTML='<button data-momo-action="play">Play</button><button data-momo-action="favorite">Favorite</button><button data-momo-action="playlist">Add to playlist</button><button data-momo-action="shuffle">Shuffle</button>';document.body.appendChild(menu);}
  var targetSong=null;
  function closeMenu(){menu.classList.remove('open');targetSong=null;}
  document.addEventListener('contextmenu',function(e){var song=e.target.closest&&e.target.closest('.song');if(!song)return;e.preventDefault();e.stopPropagation();targetSong=song;menu.classList.add('open');var x=Math.min(e.clientX,window.innerWidth-menu.offsetWidth-8),y=Math.min(e.clientY,window.innerHeight-menu.offsetHeight-8);menu.style.left=Math.max(8,x)+'px';menu.style.top=Math.max(8,y)+'px';},true);
  document.addEventListener('click',function(e){if(!menu.contains(e.target))closeMenu();});window.addEventListener('blur',closeMenu);
  menu.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(!b||!targetSong)return;var action=b.getAttribute('data-momo-action');if(action==='play')targetSong.click();if(action==='favorite'){var fav=targetSong.querySelector('.icon-btn');if(fav)fav.click();}if(action==='playlist'){var add=document.querySelector('#addToPlaylistBtn,[data-action="add-to-playlist"],.add-playlist,.playlist-add');if(add)add.click();}if(action==='shuffle')shufflePage(targetSong.closest('.page')||document);closeMenu();});
  function shufflePage(scope){var songs=Array.prototype.slice.call(scope.querySelectorAll('.songs .song'));if(!songs.length)return;songs[Math.floor(Math.random()*songs.length)].click();}
  function addShuffle(){
    document.querySelectorAll('.momo-shuffle-btn').forEach(function(b){b.remove();});
    document.querySelectorAll('.page.active').forEach(function(page){if(!page.querySelector('.songs'))return;var host=page.querySelector('.library-tools,.playlist-buttons,.library-top,.head');if(!host)return;var b=document.createElement('button');b.type='button';b.className='momo-shuffle-btn';b.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 7h4c4 0 6 10 10 10h4"/><path d="m18 14 3 3-3 3"/><path d="M3 17h4c1.5 0 2.8-1.4 4-3.1M18 4l3 3-3 3"/></svg><span>Shuffle</span>';b.addEventListener('click',function(){shufflePage(page);});host.appendChild(b);});
  }
  addShuffle();var observer=new MutationObserver(function(){window.setTimeout(addShuffle,0);});observer.observe(document.body,{childList:true,subtree:true});
})();
</script>
</body></html>
