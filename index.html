<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momoirobara</title>
<style>
:root{--bg:#fff7fc;--panel:#fff;--ink:#4d4050;--muted:#9c879b;--pink:#f39ac4;--pink2:#ffd3e6;--line:#f3d9e7;--shadow:0 12px 35px #d98fb41c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 20% 20%,#ffdceb 0 7%,transparent 20%),radial-gradient(circle at 80% 30%,#e8ddff 0 6%,transparent 20%),radial-gradient(circle at 50% 90%,#dff7ee 0 7%,transparent 22%);animation:aurora 16s ease-in-out infinite alternate;pointer-events:none;z-index:0}
@keyframes aurora{to{transform:translate3d(3%,2%,0) scale(1.08)}}
.flowers{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}.flower{position:absolute;width:42px;height:42px;opacity:.42;animation:float 14s ease-in-out infinite;filter:drop-shadow(0 5px 8px #c987a21c)}.flower:before,.flower:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--pink2);box-shadow:0 -12px 0 #fff0f7,0 12px 0 #fff0f7,12px 0 0 #fff0f7,-12px 0 0 #fff0f7}.flower:after{inset:16px;background:#f5b3d0;box-shadow:none}@keyframes float{0%,100%{transform:translate3d(0,15px,0) rotate(0)}50%{transform:translate3d(18px,-25px,0) rotate(18deg)}}
.app{position:relative;z-index:2;height:100vh;display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 92px}.sidebar{padding:22px 14px;background:#fff9fdc7;backdrop-filter:blur(18px);border-right:1px solid var(--line)}.brand{font-weight:800;font-size:22px;padding:10px 12px 24px}.nav button,.toolbar button,.player button{border:0;background:transparent;color:inherit;cursor:pointer}.nav button{width:100%;text-align:left;padding:12px 14px;border-radius:14px;font-size:14px}.nav button:hover,.nav .active{background:var(--pink2)}main{overflow:auto;padding:30px 36px}.page{max-width:1100px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.head h1{margin:0;font-size:30px}.toolbar{display:flex;gap:8px}.cute-btn{padding:10px 15px;border:1px solid var(--line)!important;border-radius:14px;background:#fff!important;box-shadow:var(--shadow);font-weight:700}.songs{display:grid;gap:8px}.song{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:9px;border:1px solid transparent;border-radius:17px}.song:hover{background:#fff9; border-color:var(--line)}.cover{width:52px;height:52px;border-radius:13px;object-fit:cover;background:#ffe4ef}.song-title{font-weight:700}.song-artist{font-size:13px;color:var(--muted)}.heart{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.heart:hover{background:var(--pink2)}
.player{grid-column:1/3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:12px 24px;background:#fffafde8;backdrop-filter:blur(22px);border-top:1px solid var(--line);box-shadow:0 -10px 30px #b8759812;z-index:20}.now{display:flex;align-items:center;gap:12px;min-width:0}.now img{width:58px;height:58px;border-radius:14px;object-fit:cover}.now b,.now span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now span{font-size:12px;color:var(--muted)}.controls{display:flex;align-items:center;gap:8px}.controls button{font-size:20px;width:38px;height:38px}.play{background:var(--pink)!important;color:white!important;border-radius:50%}.volume{justify-self:end}.progress-wrap{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:pointer}.progress{height:4px;background:var(--line);border-radius:99px}.progress i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px;transition:none}.lyrics{position:fixed;right:28px;bottom:108px;width:min(480px,calc(100vw - 280px));max-height:65vh;overflow:auto;background:#fffdfef0;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);z-index:15;backdrop-filter:blur(18px)}.lyric{padding:10px 4px;color:#b09eae;position:relative;transition:transform .35s ease,color .35s ease}.lyric.active{color:var(--ink);transform:scale(1.03)}.lyric .bar{position:absolute;left:4px;right:4px;bottom:2px;height:2px;background:var(--pink);transform-origin:left;transform:scaleX(var(--p,0));border-radius:9px}.word.active{color:var(--pink)}
.context{position:fixed;display:none;z-index:100;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 18px 50px #6b43531f;min-width:180px}.context button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:11px;cursor:pointer}.context button:hover{background:var(--pink2)}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:1fr 82px}.sidebar{display:none}.player{grid-template-columns:1fr auto}.volume{display:none}main{padding:20px}.lyrics{left:15px;right:15px;width:auto;bottom:95px}}
</style>
</head>
<body>
<div class="flowers"><i class="flower" style="left:8%;top:14%;animation-delay:-2s"></i><i class="flower" style="right:12%;top:20%;animation-delay:-7s;transform:scale(.7)"></i><i class="flower" style="left:32%;bottom:18%;animation-delay:-10s;transform:scale(.55)"></i><i class="flower" style="right:30%;bottom:8%;animation-delay:-4s;transform:scale(.8)"></i></div>
<div class="app"><aside class="sidebar"><div class="brand">✿ momoirobara</div><nav class="nav"><button class="active">Home</button><button>All Music</button><button>Favorites</button><button>Playlists</button><button>Artists</button><button>Lyrics</button><button>Last.fm</button><button>Settings</button></nav></aside><main><section class="page"><div class="head"><h1>All Music</h1><div class="toolbar"><button class="cute-btn" id="shuffle">Shuffle</button></div></div><div class="songs" id="songs"></div></section></main><footer class="player"><div class="progress-wrap" id="progressWrap"><div class="progress"><i id="progress"></i></div></div><div class="now"><img id="nowCover"><div><b id="nowTitle">Nothing playing</b><span id="nowArtist">Choose a song</span></div></div><div class="controls"><button id="prev">◀</button><button id="play" class="play">▶</button><button id="next">▶</button></div><div class="volume">♪</div></footer></div>
<div class="lyrics" id="lyrics" hidden></div><div class="context" id="context"><button data-action="play">Play</button><button data-action="queue">Add to queue</button><button data-action="favorite">Favorite</button><button data-action="playlist">Add to playlist</button></div>
<script>
const songs=[];let current=-1,raf=0;const $=s=>document.querySelector(s), songsEl=$('#songs'),audio=new Audio();
function render(){songsEl.innerHTML=songs.map((s,i)=>`<article class="song" data-i="${i}"><img class="cover" src="${s.art||''}"><div><div class="song-title">${esc(s.title||'Unknown')}</div><div class="song-artist">${esc(s.artist||'Unknown artist')}</div></div><button class="heart" data-fav="${i}">${s.favorite?'♥':'♡'}</button></article>`).join('')}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
songsEl.onclick=e=>{const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();const i=+fav.dataset.fav;songs[i].favorite=!songs[i].favorite;render();return}const row=e.target.closest('.song');if(row)play(+row.dataset.i)};
songsEl.oncontextmenu=e=>{const row=e.target.closest('.song');if(!row)return;e.preventDefault();menu.dataset.i=row.dataset.i;menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';menu.style.display='block'};
const menu=$('#context');document.onclick=()=>menu.style.display='none';menu.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+menu.dataset.i;if(b.dataset.action==='play')play(i);if(b.dataset.action==='favorite'){songs[i].favorite=!songs[i].favorite;render()}menu.style.display='none'};
function play(i){current=i;const s=songs[i];audio.src=s.url;audio.play();$('#nowTitle').textContent=s.title||'Unknown';$('#nowArtist').textContent=s.artist||'Unknown artist';$('#nowCover').src=s.art||'';startFrame()}
$('#play').onclick=()=>audio.paused?audio.play():audio.pause();$('#shuffle').onclick=()=>{if(songs.length)play(Math.floor(Math.random()*songs.length))};$('#prev').onclick=()=>current>0&&play(current-1);$('#next').onclick=()=>current>=0&&current<songs.length-1&&play(current+1);
$('#progressWrap').onclick=e=>{if(!audio.duration)return;audio.currentTime=(e.clientX/e.currentTarget.clientWidth)*audio.duration};
function startFrame(){cancelAnimationFrame(raf);const frame=()=>{const p=audio.duration?audio.currentTime/audio.duration:0;$('#progress').style.width=(p*100)+'%';raf=requestAnimationFrame(frame)};frame()};audio.addEventListener('play',startFrame);audio.addEventListener('pause',()=>cancelAnimationFrame(raf));
// Word-level lyric renderer accepts [{start,end,words:[{text,start,end}]}] when a provider supplies timestamps.
function renderLyrics(lines){const box=$('#lyrics');box.innerHTML=lines.map((l,i)=>`<div class="lyric" data-start="${l.start}" data-end="${l.end||0}">${(l.words?l.words.map(w=>`<span class="word" data-start="${w.start}" data-end="${w.end||0}">${esc(w.text)}</span>`).join(' '):esc(l.text||''))}<i class="bar"></i></div>`).join('')}
function updateLyrics(lines){const t=audio.currentTime;let active=-1;lines.forEach((l,i)=>{if(t>=l.start&&(i===lines.length-1||t<lines[i+1].start))active=i});document.querySelectorAll('.lyric').forEach((el,i)=>{el.classList.toggle('active',i===active);if(i===active){const l=lines[i],p=Math.max(0,Math.min(1,(t-l.start)/Math.max(.01,(l.end||lines[i+1]?.start||l.start+.1)-l.start)));el.style.setProperty('--p',p);el.scrollIntoView({block:'center',behavior:'smooth'});el.querySelectorAll('.word').forEach(w=>w.classList.toggle('active',t>=+w.dataset.start&&t<+(w.dataset.end||Infinity)))}})}
</script><!-- MOMOIROBARA FLOWING LYRICS + FLOWER BACKGROUND V1 -->
<style id="momo-flowing-lyrics-bg">
#momoFlowerField{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:.72}
#momoFlowerField .momo-flower{position:absolute;width:24px;height:24px;filter:drop-shadow(0 5px 14px color-mix(in srgb,var(--a) 22%,transparent));animation:momoFlowerFloat var(--fd,18s) ease-in-out infinite alternate,momoFlowerSpin var(--fs,28s) linear infinite;will-change:transform}
#momoFlowerField .momo-petal{position:absolute;left:8px;top:1px;width:8px;height:12px;border-radius:70% 70% 55% 55%;background:color-mix(in srgb,var(--a) 68%,white);transform-origin:50% 11px;opacity:.72}
#momoFlowerField .momo-center{position:absolute;left:9px;top:9px;width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--b) 78%,white);box-shadow:0 0 12px color-mix(in srgb,var(--b) 35%,transparent)}
@keyframes momoFlowerFloat{0%{translate:0 0;opacity:.25}50%{opacity:.72}100%{translate:var(--dx,30px) var(--dy,-70px);opacity:.48}}
@keyframes momoFlowerSpin{to{rotate:360deg}}
@media(prefers-reduced-motion:reduce){#momoFlowerField .momo-flower{animation:none!important}}
#lyr{scroll-behavior:smooth!important;overflow-anchor:none}
#lyr .line{scroll-margin-top:42vh;transition:color .22s ease,opacity .28s ease,transform .38s cubic-bezier(.2,.8,.2,1)!important}
#lyr .line.active{transform:scale(1.025) translateX(3px)!important;color:var(--text)!important}
#lyr .line::after{bottom:-7px!important;height:2px!important;transform-origin:left center!important;transition:width .05s linear!important}
#lyr .momo-word{display:inline-block;position:relative;color:inherit;transition:color .08s linear,opacity .08s linear}
#lyr .momo-word.done{color:var(--text)}
#lyr .momo-word.current{color:var(--text);text-shadow:0 0 12px color-mix(in srgb,var(--a) 22%,transparent)}
#lyr .momo-word.future{color:var(--muted)}
</style>
<script id="momo-flowing-lyrics-bg-js">
(()=>{
  'use strict';
  const audio=document.getElementById('audio'), lyr=document.getElementById('lyr');
  const parseTime=v=>{const n=Number(v);if(Number.isFinite(n))return n>1000?n/1000:n;const m=String(v||'').match(/^(?:(\d+):)?(\d+)(?:\.(\d+))?$/);return m?Number(m[1]||0)*60+Number(m[2])+Number('0.'+(m[3]||'0')):NaN};
  const parseEnhanced=l=>{const out=[];const re=/<(\d{1,3}):(\d{2})(?:\.(\d{1,3}))?>/g;let m,last=0;while((m=re.exec(l))){if(m.index>last)out.push({text:l.slice(last,m.index),time:parseTime(`${m[1]}:${m[2]}.${m[3]||'0'}`)});last=re.lastIndex}if(last<l.length)out.push({text:l.slice(last),time:NaN});return out};
  const decorate=()=>{if(!lyr)return;lyr.querySelectorAll('.line').forEach(line=>{if(line.dataset.momoWordsReady)return;const raw=line.textContent||'';const words=parseEnhanced(raw);if(words.filter(w=>Number.isFinite(w.time)).length<2)return;line.dataset.momoWordsReady='1';line.innerHTML='';words.forEach(w=>{const s=document.createElement('span');s.className='momo-word future';s.textContent=w.text;s.dataset.time=String(w.time);line.appendChild(s)})})};
  const lineTime=l=>parseTime(l?.dataset?.time||l?.dataset?.start);
  let active=-1;
  const render=()=>{if(!audio||!lyr)return;decorate();const now=audio.currentTime||0,lines=[...lyr.querySelectorAll('.line')],times=lines.map(lineTime);let next=-1;times.forEach((t,i)=>{if(Number.isFinite(t)&&t<=now+.015)next=i});if(next!==active){active=next;if(active>=0){const el=lines[active];const target=el.offsetTop-(lyr.clientHeight*.5)+(el.offsetHeight*.5);lyr.scrollTo({top:Math.max(0,target),behavior:'smooth'})}}lines.forEach((line,i)=>{const start=times[i],end=Number.isFinite(times[i+1])?times[i+1]:now+3;const p=i===active&&Number.isFinite(start)?Math.max(0,Math.min(1,(now-start)/Math.max(.05,end-start))):0;line.style.setProperty('--momo-line-progress',(p*100).toFixed(2)+'%');line.classList.toggle('active',i===active);const words=[...line.querySelectorAll('.momo-word')];if(words.length){let wi=-1;words.forEach((w,j)=>{const t=parseTime(w.dataset.time);if(Number.isFinite(t)&&t<=now+.01)wi=j});words.forEach((w,j)=>w.className='momo-word '+(j<wi?'done':j===wi?'current':'future'))}})};
  if(audio){['timeupdate','seeking','seeked','loadedmetadata'].forEach(e=>audio.addEventListener(e,render,{passive:true}));const loop=()=>{render();requestAnimationFrame(loop)};requestAnimationFrame(loop)}
  if(lyr)new MutationObserver(()=>requestAnimationFrame(decorate)).observe(lyr,{childList:true,subtree:true});
  if(!document.getElementById('momoFlowerField')){const f=document.createElement('div');f.id='momoFlowerField';for(let i=0;i<24;i++){const x=document.createElement('i');x.className='momo-flower';x.style.left=(Math.random()*100)+'%';x.style.top=(Math.random()*105)+'%';x.style.setProperty('--fd',(15+Math.random()*18)+'s');x.style.setProperty('--fs',(20+Math.random()*28)+'s');x.style.setProperty('--dx',(-80+Math.random()*160)+'px');x.style.setProperty('--dy',(-40-Math.random()*110)+'px');for(let j=0;j<6;j++){const p=document.createElement('i');p.className='momo-petal';p.style.transform=`rotate(${j*60}deg)`;x.appendChild(p)}const c=document.createElement('i');c.className='momo-center';x.appendChild(c);f.appendChild(x)}document.body.insertBefore(f,document.body.firstChild)}
})();
</script>

</body></html>
