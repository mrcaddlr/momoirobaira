name: Apply UI fix

on:
  push:
    branches:
      - fix/canvas-background-mouse-trail

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('cursor:none','cursor:auto')
          s = s.replace('<div class="cursor-dot" id="cursorDot"></div><div class="cursor-ring" id="cursorRing"></div>','')
          s = s.replace('<canvas id="fx"></canvas><canvas id="ambientCanvas"></canvas>','<canvas id="fx"></canvas><canvas id="ambientCanvas"></canvas><canvas id="mouseTrail"></canvas>')
          s = s.replace('#fx{z-index:0}#ambientCanvas{z-index:1}', '#fx{z-index:0}#ambientCanvas{z-index:1}#mouseTrail{z-index:3}')
          s = s.replace('.cursor-dot,.cursor-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:10000;transform:translate(-50%,-50%)}','')
          s = s.replace('.cursor-dot{width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 14px color-mix(in srgb,var(--a) 70%,transparent)}','')
          s = s.replace('.cursor-ring{width:30px;height:30px;border:1.5px solid color-mix(in srgb,var(--a) 75%,transparent);border-radius:50%;transition:width .18s var(--ease),height .18s var(--ease),background .18s ease,border-color .18s ease}','')
          s = s.replace('body.cursor-hover .cursor-ring{width:44px;height:44px;background:color-mix(in srgb,var(--a) 9%,transparent);border-color:var(--a)}','')
          s = s.replace('body.cursor-down .cursor-ring{width:24px;height:24px}','')
          s = s.replace('const dot=$(\'cursorDot\'),ring=$(\'cursorRing\');let mx=-100,my=-100,rx=-100,ry=-100;addEventListener(\'pointermove\',e=>{if(e.pointerType===\'mouse\'||e.pointerType===\'pen\'){mx=e.clientX;my=e.clientY}});addEventListener(\'pointerdown\',e=>{if(e.pointerType===\'mouse\'){document.body.classList.add(\'cursor-down\');setTimeout(()=>document.body.classList.remove(\'cursor-down\'),120)}});document.addEventListener(\'mouseover\',e=>{if(e.target.closest(\'button,input,select,.song,.pl-item,.round-action\'))document.body.classList.add(\'cursor-hover\')});document.addEventListener(\'mouseout\',e=>{if(e.target.closest(\'button,input,select,.song,.pl-item,.round-action\'))document.body.classList.remove(\'cursor-hover\')});function cursorLoop(){rx+=(mx-rx)*.28;ry+=(my-ry)*.28;dot.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`;ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;ring.style.display=document.documentElement.dataset.cursor===\'off\'?\'none\':\'block\';dot.style.display=document.documentElement.dataset.cursor===\'off\'?\'none\':\'block\';requestAnimationFrame(cursorLoop)}cursorLoop();', '')
          s = s.replace('<div class="setting"><div><b>Custom cursor</b><small>Use the small dot and ring cursor.</small></div><div class="setting-right"><input id="cursorToggle" type="checkbox" checked></div></div>', '')
          s = s.replace("$('cursorToggle').onchange=e=>{document.documentElement.dataset.cursor=e.target.checked?'on':'off';localStorage.setItem('cursor',e.target.checked?'on':'off')};", '')
          s = s.replace("document.documentElement.dataset.cursor=localStorage.getItem('cursor')||'on';", '')
          s = s.replace("$('cursorToggle').checked=document.documentElement.dataset.cursor!=='off';", '')
          marker='// Canvas background: particles + home lava-lamp blobs'
          start=s.find(marker)
          if start<0: raise SystemExit('canvas marker missing')
          end=s.find('// Init',start)
          if end<0: raise SystemExit('init marker missing')
          new_canvas=r'''// Canvas UI-inspired Liquid background + restored mouse trail
const fx=$('fx'),fctx=fx.getContext('2d'),ac=$('ambientCanvas'),actx=ac.getContext('2d'),trailCanvas=$('mouseTrail'),trailCtx=trailCanvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1,tt=0;
const fluid=Array.from({length:18},()=>({x:Math.random(),y:Math.random(),vx:0,vy:0,r:.025+Math.random()*.045,h:Math.random()*6.28}));
const trail=Array.from({length:22},()=>({x:-100,y:-100,life:0,r:1}));let trailHead=0,mouseX=-100,mouseY=-100;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);for(const c of [fx,ac,trailCanvas]){c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}}
function color(){return getComputedStyle(document.documentElement).getPropertyValue('--a').trim()||'#ff79a8'}
addEventListener('pointermove',e=>{if(e.pointerType!=='touch'){mouseX=e.clientX;mouseY=e.clientY;const t=trail[trailHead];t.x=mouseX;t.y=mouseY;t.life=1;t.r=2.5;trailHead=(trailHead+1)%trail.length}});
function draw(){fctx.clearRect(0,0,W,H);actx.clearRect(0,0,W,H);trailCtx.clearRect(0,0,W,H);if(document.documentElement.dataset.fx!=='off'){const col=color();
  const grad=actx.createLinearGradient(0,0,W,H);grad.addColorStop(0,col+'08');grad.addColorStop(.5,'transparent');grad.addColorStop(1,col+'10');actx.fillStyle=grad;actx.fillRect(0,0,W,H);
  fluid.forEach((b,i)=>{const tx=.5+Math.sin(tt*.00018+b.h)*.3,ty=.55+Math.cos(tt*.00015+b.h*1.7)*.25;b.vx+=(tx-b.x)*.000015;b.vy+=(ty-b.y)*.000015;b.vx*=.985;b.vy*=.985;b.x+=b.vx;b.y+=b.vy;const x=b.x*W,y=b.y*H,r=b.r*Math.min(W,H);const g=actx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col+'18');g.addColorStop(.45,col+'0a');g.addColorStop(1,'transparent');actx.fillStyle=g;actx.beginPath();actx.arc(x,y,r,0,Math.PI*2);actx.fill()});
  actx.globalCompositeOperation='screen';const mx=mouseX,my=mouseY;for(let i=0;i<3;i++){const x=mx+(i-1)*80+Math.sin(tt*.002+i)*18,y=my+(i-1)*45;const g=actx.createRadialGradient(x,y,0,x,y,130);g.addColorStop(0,col+'16');g.addColorStop(1,'transparent');actx.fillStyle=g;actx.beginPath();actx.arc(x,y,130,0,Math.PI*2);actx.fill()}actx.globalCompositeOperation='source-over';
  trail.forEach(t=>{if(t.life<=0)return;t.life*=.89;t.r*=.96;trailCtx.beginPath();trailCtx.arc(t.x,t.y,Math.max(.35,t.r),0,Math.PI*2);trailCtx.fillStyle=col+Math.floor(t.life*110).toString(16).padStart(2,'0');trailCtx.fill()});
}tt++;requestAnimationFrame(draw)}resize();addEventListener('resize',resize);draw();
'''
          s=s[:start]+new_canvas+s[end:]
          s=s.replace("document.documentElement.dataset.fx=localStorage.getItem('fx')||'on';", "document.documentElement.dataset.fx=localStorage.getItem('fx')||'on';")
          p.write_text(s)
      - name: Commit and clean up
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm .github/workflows/_apply_ui_fix.yml
          git commit -m "Remove custom cursor and restore mouse trail" || exit 0
          git push
