name: Clean kawaii UI rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redo-kawaii-ui.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message != 'chore: apply clean kawaii UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply clean UI layer
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '/* MOMOIROBARA CLEAN KAWAII UI */'
          if marker in html:
              raise SystemExit('clean kawaii layer already exists')

          css = r'''
          /* MOMOIROBARA CLEAN KAWAII UI */
          .density-compact .song{padding:6px 9px;gap:9px}.density-compact .cover{width:46px;height:46px}.density-compact .songs{gap:5px}
          .density-normal .song{padding:9px 11px;gap:12px}.density-normal .cover{width:54px;height:54px}.density-normal .songs{gap:8px}
          .density-cozy .song,.density-spacious .song{padding:14px 13px;gap:14px}.density-cozy .cover,.density-spacious .cover{width:60px;height:60px}.density-cozy .songs,.density-spacious .songs{gap:11px}
          .density-relaxed .song{padding:16px 15px;gap:16px}.density-relaxed .cover{width:64px;height:64px}.density-relaxed .songs{gap:13px}

          .player,.player-bar,.now-playing,.player-controls,.progress-wrap,.progress-container{background:transparent!important;box-shadow:none!important}
          .transport,.transport button,.transport .icon-btn{background:transparent!important;box-shadow:none!important}
          input[type="range"].range,input[type="range"]{background:transparent}
          input[type="range"].range::-webkit-slider-runnable-track,input[type="range"]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:var(--track);border:0}
          input[type="range"].range::-webkit-slider-thumb,input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));border:2px solid var(--solid);box-shadow:0 2px 8px color-mix(in srgb,var(--a) 30%,transparent)}
          input[type="range"].range::-moz-range-track,input[type="range"]::-moz-range-track{height:4px;border-radius:999px;background:var(--track);border:0}
          input[type="range"].range::-moz-range-progress,input[type="range"]::-moz-range-progress{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b))}
          input[type="range"].range::-moz-range-thumb,input[type="range"]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--a);border:2px solid var(--solid)}

          .kawaii-close{position:absolute;top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:color-mix(in srgb,var(--solid) 92%,transparent);color:var(--muted);z-index:50;box-shadow:var(--shadow2);transition:transform .22s var(--ease),color .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
          .kawaii-close:hover{transform:rotate(8deg) scale(1.06);color:var(--a);border-color:var(--a);box-shadow:0 8px 20px color-mix(in srgb,var(--a) 18%,transparent)}
          .kawaii-close:active{transform:scale(.92)}.kawaii-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
          .side .kawaii-close{display:none}@media(max-width:900px){.side .kawaii-close{display:grid;top:12px;right:12px}.side .logo{position:relative;margin:0 auto;padding:0 10px;width:max-content;min-width:0}.side .logo-flower{width:34px;height:34px}.side .logo span{font-size:17px}}

          .kawaii-click{position:fixed;left:0;top:0;width:20px;height:20px;pointer-events:none;z-index:100000;transform:translate(-50%,-50%) scale(.15);border:2px solid var(--a);border-radius:50%;opacity:.9;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--a) 32%,transparent));animation:kawaii-ring .62s var(--ease) forwards}
          .kawaii-click::before,.kawaii-click::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50% 20% 50% 20%;background:var(--b);animation:kawaii-dot .58s var(--ease) forwards}
          .kawaii-click::before{transform:translate(-50%,-50%) rotate(45deg) translateY(-3px)}.kawaii-click::after{background:var(--a);transform:translate(-50%,-50%) rotate(225deg) translateY(-3px)}
          .kawaii-spark{position:absolute;left:50%;top:50%;width:4px;height:9px;border-radius:99px;background:var(--a);transform-origin:50% 18px;animation:kawaii-spark .58s var(--ease) forwards}
          .kawaii-spark:nth-child(2){transform:translate(-50%,-50%) rotate(0deg) translateY(-3px)}.kawaii-spark:nth-child(3){transform:translate(-50%,-50%) rotate(90deg) translateY(-3px)}.kawaii-spark:nth-child(4){transform:translate(-50%,-50%) rotate(180deg) translateY(-3px)}.kawaii-spark:nth-child(5){transform:translate(-50%,-50%) rotate(270deg) translateY(-3px)}
          @keyframes kawaii-ring{to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}@keyframes kawaii-dot{to{opacity:0;transform:translate(-50%,-50%) rotate(45deg) translateY(-20px) scale(.25)}}@keyframes kawaii-spark{to{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle,0deg)) translateY(-27px) scale(.35)}}
          .kawaii-pop{animation:kawaii-pop .25s var(--ease)}@keyframes kawaii-pop{0%{transform:scale(1)}45%{transform:scale(.95)}100%{transform:scale(1)}}
          .nav button,.tool,.side-action,.icon-btn,.round-action,.transport button,.primary,.secondary,.picker{transition:transform .22s var(--ease),background .22s var(--ease),border-color .22s var(--ease),color .22s var(--ease),box-shadow .22s var(--ease)}
          .nav button:active,.tool:active,.side-action:active,.icon-btn:active,.round-action:active,.transport button:active,.primary:active,.secondary:active,.picker:active{transform:scale(.96)}
          :root[data-animations="off"] .kawaii-click{display:none!important}:root[data-animations="low"] .kawaii-click{animation-duration:.4s}
          .page.active{animation:kawaii-page-in .42s var(--ease)}@keyframes kawaii-page-in{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
          '''

          js = r'''
          /* CLEAN KAWAII INTERACTIONS */
          (()=>{
            const escSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>';
            const closeButton=(parent,id,label,action)=>{
              if(!parent||parent.querySelector('.kawaii-close'))return;
              const b=document.createElement('button');b.type='button';b.className='kawaii-close';b.id=id;b.setAttribute('aria-label',label);b.innerHTML=escSvg;
              parent.appendChild(b);b.addEventListener('click',e=>{e.stopPropagation();action()});
            };
            const findByText=(needle)=>[...document.querySelectorAll('button,[role="button"]')].find(el=>(el.textContent||'').trim().toLowerCase().includes(needle));
            const findMenuButton=()=>[...document.querySelectorAll('button')].find(el=>{const s=((el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')+' '+(el.textContent||'')).toLowerCase();return s.includes('menu')||s.includes('sidebar')});
            const setup=()=>{
              const side=document.querySelector('.side');
              const lyrics=document.querySelector('.drawer,.lyrics-drawer,#lyricsDrawer');
              closeButton(side,'mobileClose','Close menu',()=>{const m=findMenuButton();if(m&&m!==document.getElementById('mobileClose'))m.click();else side?.classList.remove('open','show','active')});
              if(lyrics)closeButton(lyrics,'lyricsClose','Close lyrics',()=>{const b=findByText('lyrics');if(b)b.click();else lyrics.classList.remove('open','show','active')});
              const settings=findByText('settings');
              const svg=settings?.querySelector('.nav-icon svg');
              if(svg){svg.innerHTML='<path d="M9.5 3.8h5l.8 2.1c.5.2 1 .5 1.5.9l2.1-.8 2.5 4.3-1.7 1.5c.1.6.1 1.1 0 1.7l1.7 1.5-2.5 4.3-2.1-.8c-.5.4-1 .7-1.5.9l-.8 2.1h-5l-.8-2.1c-.5-.2-1-.5-1.5-.9l-2.1.8-2.5-4.3 1.7-1.5a7 7 0 0 1 0-1.7L2.6 10.3l2.5-4.3 2.1.8c.5-.4 1-.7 1.5-.9l.8-2.1Z"/><circle cx="12" cy="12.6" r="2.5"/>'}
              const density=document.querySelector('#density,select[name="density"]');
              if(density){const apply=()=>{document.documentElement.classList.remove('density-compact','density-normal','density-cozy','density-spacious','density-relaxed');const v=(density.value||'normal').toLowerCase();document.documentElement.classList.add('density-'+v);try{localStorage.setItem('density',v)}catch{}};density.addEventListener('change',apply);density.addEventListener('input',apply);apply()}
            };
            const burst=e=>{if(document.documentElement.dataset.animations==='off')return;if(e.clientX<0||e.clientY<0)return;const f=document.createElement('span');f.className='kawaii-click';f.style.left=e.clientX+'px';f.style.top=e.clientY+'px';for(let i=0;i<4;i++){const s=document.createElement('i');s.className='kawaii-spark';s.style.setProperty('--angle',(i*90)+'deg');f.appendChild(s)}document.body.appendChild(f);setTimeout(()=>f.remove(),700);const hit=e.target.closest?.('button,.tool,.side-action,.icon-btn,.round-action,.primary,.secondary,.picker,.nav button,.pl-item');if(hit){hit.classList.remove('kawaii-pop');void hit.offsetWidth;hit.classList.add('kawaii-pop');setTimeout(()=>hit.classList.remove('kawaii-pop'),280)}};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();
            document.addEventListener('pointerdown',burst,{passive:true});
          })();
          '''

          html = html.replace('</style>', css + '\n</style>', 1)
          html = html.replace('</body>', '<script>\n' + js + '\n</script>\n</body>', 1)
          if '</html>' not in html or html.count('</style>') < 1 or html.count('</script>') < 1:
              raise SystemExit('generated HTML structure check failed')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(script); name=f.name
              result=subprocess.run(['node','--check',name],capture_output=True,text=True)
              Path(name).unlink(missing_ok=True)
              if result.returncode:
                  print(result.stderr)
                  raise SystemExit(f'inline JavaScript syntax check failed for script {i}')
          path.write_text(html,encoding='utf-8')

      - name: Commit clean UI and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/redo-kawaii-ui.yml
          git commit -m 'chore: apply clean kawaii UI'
          git push
