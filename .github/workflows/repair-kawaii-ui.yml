name: Repair kawaii UI safely

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/repair_kawaii_ui.py
      - .github/workflows/repair-kawaii-ui.yml

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message != 'fix: apply safe kawaii UI repair'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe UI patch
        run: python3 .github/scripts/repair_kawaii_ui.py
      - name: Commit patched UI and remove one-shot repair files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/repair_kawaii_ui.py .github/workflows/repair-kawaii-ui.yml
          git diff --cached --check
          git commit -m "fix: apply safe kawaii UI repair"
          git push origin main
