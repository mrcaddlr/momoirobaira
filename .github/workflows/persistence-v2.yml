name: Make Momoirobara remember on browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[persistence-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject browser persistence bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MOMOIROBARA PERSISTENCE V2 -->'
          if marker in s:
              print('already patched')
              raise SystemExit
          patch=r'''<!-- MOMOIROBARA PERSISTENCE V2 -->
          <script>
          (()=>{
            'use strict';
            const DB='momoirobara-files-v2', STORE='files';
            let dbPromise;
            const openDB=()=>dbPromise||(dbPromise=new Promise((resolve,reject)=>{
              if(!('indexedDB' in window)) return reject(Error('IndexedDB unavailable'));
              const r=indexedDB.open(DB,1);
              r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});
              r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
            }));
            const key=f=>`${f.name}::${f.size}::${f.lastModified}`;
            async function remember(files){
              try{
                const db=await openDB(), tx=db.transaction(STORE,'readwrite'), st=tx.objectStore(STORE);
                for(const f of files||[]) if(f?.size) st.put({id:key(f),name:f.name,size:f.size,lastModified:f.lastModified,type:f.type,blob:f});
              }catch(e){console.warn('Momoirobara file persistence:',e)}
            }
            async function restore(){
              try{
                if(document.querySelector('#library .song,#recent .song')) return;
                const db=await openDB(), rows=await new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)});
                if(!rows.length) return;
                const files=rows.map(x=>new File([x.blob],x.name,{type:x.type||'audio/*',lastModified:x.lastModified||Date.now()}));
                const input=document.getElementById('file');
                if(!input||!window.DataTransfer) return;
                const dt=new DataTransfer(); files.forEach(f=>dt.items.add(f));
                input.files=dt.files;
                input.dispatchEvent(new Event('change',{bubbles:true}));
              }catch(e){console.warn('Momoirobara restore:',e)}
            }
            function mirrorState(){
              try{
                const state={};
                for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k) state[k]=localStorage.getItem(k)}
                localStorage.setItem('momoirobara_state_mirror_v2',JSON.stringify({updated:Date.now(),state}));
              }catch{}
            }
            function trackPage(){
              const active=document.querySelector('.page.active');
              if(active) localStorage.setItem('momoirobara.lastPage',active.id.replace(/^page-/,''));
            }
            document.addEventListener('change',e=>{if(e.target?.id==='file'||e.target?.id==='folder')remember([...e.target.files]);},true);
            document.addEventListener('click',e=>{
              if(e.target.closest('.nav button,[data-page],#newPlaylistBtn,[data-edit-pl],[data-add-pl],[data-fav],#theme,#animations,#fxToggle,#density,#clear')){
                setTimeout(()=>{trackPage();mirrorState();},150);
              }
            },true);
            document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){trackPage();mirrorState()}});
            window.addEventListener('pagehide',()=>{trackPage();mirrorState()});
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(restore,1800),{once:true}); else setTimeout(restore,1800);
            setTimeout(trackPage,2200);
          })();
          </script>
          '''
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add reliable browser file persistence [persistence-v2]'
          git push
