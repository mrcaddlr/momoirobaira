name: Apply Momoirobara flower UI repair

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/repair_momoirobara.mjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply repair
        run: node .github/scripts/repair_momoirobara.mjs

      - name: Validate repaired UI
        run: node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); if(!s.includes('MOMOIROBARA FLOWER UI REPAIR')) throw new Error('flower repair missing'); if(s.includes('data-density')) throw new Error('density styling still present'); if(s.includes(\"document.addEventListener('pointerdown',burst\")) throw new Error('global burst handler still present'); if(!s.includes('.player .play')) throw new Error('play button styling missing'); console.log('repair validation passed');"

      - name: Commit repaired UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/scripts/repair_momoirobara.mjs .github/scripts/repair_momoirobara.py .github/workflows/apply-flower-repair.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'chore: apply Momoirobara flower UI repair'
          git push origin main
