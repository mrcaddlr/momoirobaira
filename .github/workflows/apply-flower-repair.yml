name: Apply Momoirobara UI repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flower-repair.yml'
      - '.github/scripts/repair_momoirobara.mjs'
      - 'enhancements.js'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run repair script
        run: node .github/scripts/repair_momoirobara.mjs
      - name: Validate repaired HTML
        run: |
          node --check .github/scripts/repair_momoirobara.mjs
          test -s index.html
          grep -q 'MOMOIROBARA CLEAN FEATURE HOOKS' index.html
          grep -q 'enhancements.js' index.html
          if grep -q '❈' index.html; then echo '❈ is still present'; exit 1; fi
          if grep -q 'DIRECT UI REPAIR V2' index.html; then echo 'old repair layer is still present'; exit 1; fi
          echo 'Targeted repair validation passed'
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No index changes'; exit 0; fi
          git commit -m 'fix: apply Momoirobara UI repairs'
          git push origin main
