name: Apply Momoirobara UI repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flower-repair.yml'
      - '.github/scripts/repair_momoirobara.mjs'
      - 'enhancements.js'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run repair script
        run: node .github/scripts/repair_momoirobara.mjs
      - name: Validate repaired HTML
        run: |
          node --check .github/scripts/repair_momoirobara.mjs
          test -s index.html
          grep -q 'MOMOIROBARA INLINE BUILD' index.html
          grep -q 'momo-inline-features' index.html
          if grep -q 'src="enhancements.js"' index.html; then echo 'external enhancements.js reference remains'; exit 1; fi
          if grep -q '❈' index.html; then echo '❈ is still present'; exit 1; fi
          if grep -q 'logo-flower{display:none' index.html; then echo 'logo flower is still being hidden'; exit 1; fi
          echo 'Inline repair validation passed'
      - name: Commit repaired index and remove external feature file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix: inline Momoirobara UI features into index'
          git push origin main
