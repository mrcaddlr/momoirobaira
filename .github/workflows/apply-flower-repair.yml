name: Apply Momoirobara UI repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flower-repair.yml'
      - '.github/scripts/repair_momoirobara.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run repair script
        run: node .github/scripts/repair_momoirobara.mjs
      - name: Validate V8
        run: |
          grep -q 'MOMOIROBARA BOTANICAL UI V8' index.html
          grep -q 'momo-botanical-ui-v8' index.html
          grep -q 'momo-ripple' index.html
          grep -q 'lyric-line' index.html
          ! grep -q 'MOMOIROBARA BOTANICAL UI V7' index.html
          ! grep -q 'MOMOIROBARA TARGETED REPAIR V6' index.html
          ! grep -q 'MOMOIROBARA FLOWER UI REPAIR V[2-5]' index.html
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: apply Momoirobara V8 repair'
          git push origin main
