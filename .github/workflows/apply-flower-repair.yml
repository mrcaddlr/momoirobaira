name: Apply Momoirobara UI repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flower-repair.yml'
      - '.github/scripts/repair_momoirobara.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run repair script
        run: node .github/scripts/repair_momoirobara.mjs
      - name: Validate V8
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const x of ['MOMOIROBARA BOTANICAL UI V8','momo-botanical-ui-v8','momo-ripple','lyric-line']){if(!s.includes(x))throw new Error('Missing required V8 marker: '+x)}console.log('V8 validation passed')"
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: apply Momoirobara V8 repair'
          git push origin main
