name: Apply Momoirobara UI repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/repair_momoirobara.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply targeted repair
        run: node .github/scripts/repair_momoirobara.mjs
      - name: Validate repaired index
        run: |
          grep -q 'MOMOIROBARA BOTANICAL UI V8' index.html
          ! grep -q 'MOMOIROBARA BOTANICAL UI V7' index.html
          ! grep -q 'MOMOIROBARA TARGETED REPAIR V6' index.html
          ! grep -q 'MOMOIROBARA FLOWER UI REPAIR V[2-5]' index.html
          grep -q 'momo-botanical-ui-v8' index.html
          grep -q 'momo-ripple' index.html
          grep -q 'lyric-line' index.html
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: apply Momoirobara botanical UI repair'
          git push origin main
