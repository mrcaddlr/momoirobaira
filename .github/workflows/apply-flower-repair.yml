name: Apply Momoirobara flower UI repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: apply Momoirobara flower UI repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply repair
        run: node .github/scripts/repair_momoirobara.mjs
      - name: Validate repair
        run: |
          grep -q 'MOMOIROBARA FLOWER UI REPAIR' index.html
          ! grep -q 'data-density' index.html
          ! grep -q 'pointerdown.*burst' index.html
          grep -q '\.player \.play' index.html
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: apply Momoirobara flower UI repair'
          git push origin main
