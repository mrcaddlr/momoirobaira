name: Apply mouse trail and background fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Remove the custom cursor completely.
          s = s.replace('cursor:none', 'cursor:auto')
          s = s.replace('cursor: none', 'cursor: auto')
          s = s.replace('<div class="cursor-dot" id="cursorDot"></div><div class="cursor-ring" id="cursorRing"></div>', '')
          s = s.replace('<button class="setting"><b>Custom cursor</b>', '<button class="setting"><b>Custom cursor</b>')
          s = s.replace('<div class="setting"><div><b>Custom cursor</b><small>Use the small dot and ring cursor.</small></div><div class="setting-right"><input id="cursorToggle" type="checkbox" checked></div></div>', '')

          # Add a dedicated fire/blob trail canvas.
          s = s.replace('<canvas id="fx"></canvas>', '<canvas id="fx"></canvas><canvas id="mouseTrail"></canvas>', 1)
          if '#mouseTrail' not in s:
              s = s.replace('#fx{position:fixed;', '#mouseTrail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;mix-blend-mode:screen}\n#fx{position:fixed;', 1)
          else:
              s = s.replace('#fx{position:fixed;', '#mouseTrail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;mix-blend-mode:screen}\n#fx{position:fixed;', 1)

          # Remove the old ambient canvas element and all old background/lava code.
          s = s.replace('<canvas id="ambientCanvas"></canvas>', '')
          start = s.find('// Canvas background: particles + home lava-lamp blobs')
          end = s.find('// Init', start)
          if start < 0 or end < 0:
              raise SystemExit('old canvas section not found')

          new_canvas = r'''// Canvas UI-inspired background + original-style fire/blob mouse trail
const fx=$('fx'),fctx=fx.getContext('2d'),trailCanvas=$('mouseTrail'),trailCtx=trailCanvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1,tt=0,mouseX=-200,mouseY=-200,lastMX=-200,lastMY=-200;
const particles=Array.from({length:95},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.7,v:.035+Math.random()*.13,p:Math.random()*Math.PI*2,a:.18+Math.random()*.38}));
const fire=Array.from({length:70},()=>({x:-200,y:-200,vx:0,vy:0,life:0,size:2,seed:Math.random()*9}));
let fireHead=0;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);for(const c of [fx,trailCanvas]){c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}}
function fxColor(){return getComputedStyle(document.documentElement).getPropertyValue('--a').trim()||'#ff79a8'}
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const dx=e.clientX-lastMX,dy=e.clientY-lastMY,dist=Math.hypot(dx,dy);mouseX=e.clientX;mouseY=e.clientY;if(dist>1){const count=Math.min(7,Math.max(2,Math.floor(dist/7)));for(let i=0;i<count;i++){const t=fire[fireHead];const q=i/count;t.x=lastMX+dx*q;t.y=lastMY+dy*q;t.vx=dx*.018+(Math.random()-.5)*.75;t.vy=dy*.018+(Math.random()-.5)*.75-.28;t.life=1;t.size=2.2+Math.random()*4.8;t.seed=Math.random()*9;fireHead=(fireHead+1)%fire.length}}lastMX=e.clientX;lastMY=e.clientY});
function draw(){fctx.clearRect(0,0,W,H);trailCtx.clearRect(0,0,W,H);if(document.documentElement.dataset.fx!=='off'){const col=fxColor();
  // Soft Canvas-UI-style liquid ribbons: flowing, blended, pointer-reactive rather than floating orbs.
  const active=$('page-home')?.classList.contains('active');
  if(active){fctx.save();fctx.globalCompositeOperation='screen';fctx.filter='blur(22px)';for(let band=0;band<3;band++){const y=H*(.62+band*.08);fctx.beginPath();fctx.moveTo(-80,y);for(let x=-80;x<=W+80;x+=55){const wave=Math.sin(x*.004+tt*.0007+band*1.8)*30+Math.sin(x*.0017-tt*.00035+band)*18+(mouseX/W-.5)*45*Math.exp(-Math.abs(x-mouseX)/260);fctx.lineTo(x,y+wave)}fctx.lineTo(W+80,H+80);fctx.lineTo(-80,H+80);fctx.closePath();fctx.fillStyle=col+(band===0?'16':band===1?'0d':'08');fctx.fill()}fctx.restore()}
  // Fine background particles, no large ambient orbs.
  fctx.save();fctx.fillStyle=col+'55';particles.forEach(p=>{p.y-=p.v/1000;if(p.y<-.03)p.y=1.03;const x=p.x*W+Math.sin(tt*.00045+p.p)*12,y=p.y*H;fctx.globalAlpha=p.a;fctx.beginPath();fctx.arc(x,y,p.r,0,Math.PI*2);fctx.fill()});fctx.restore();
  // Dense glowing fire/blob trail inspired by Canvas UI Blaze/Bubble: many overlapping soft blobs.
  trailCtx.save();trailCtx.globalCompositeOperation='lighter';trailCtx.filter='blur(.35px)';fire.forEach(t=>{if(t.life<=.01)return;t.life*=.91;t.vx*=.985;t.vy=t.vy*.985-.012;t.x+=t.vx;t.y+=t.vy;t.size*=.985;const r=Math.max(.6,t.size*(.7+t.life*.8));const g=trailCtx.createRadialGradient(t.x,t.y,0,t.x,t.y,r*3.4);g.addColorStop(0,col+Math.floor(190*t.life).toString(16).padStart(2,'0'));g.addColorStop(.22,col+Math.floor(120*t.life).toString(16).padStart(2,'0'));g.addColorStop(.55,col+Math.floor(55*t.life).toString(16).padStart(2,'0'));g.addColorStop(1,'transparent');trailCtx.fillStyle=g;trailCtx.beginPath();trailCtx.arc(t.x,t.y,r*3.4,0,Math.PI*2);trailCtx.fill();});trailCtx.restore()}
  tt++;requestAnimationFrame(draw)}
resize();addEventListener('resize',resize);draw();
'''
          s = s[:start] + new_canvas + s[end:]

          # Remove old cursor JS and cursor setting initialization.
          cstart = s.find('// Cursor\n')
          if cstart >= 0:
              cend = s.find('// Canvas background', cstart)
              if cend >= 0:
                  s = s[:cstart] + s[cend:]
          s = s.replace("$('cursorToggle').onchange=e=>{document.documentElement.dataset.cursor=e.target.checked?'on':'off';localStorage.setItem('cursor',e.target.checked?'on':'off')};", '')
          s = s.replace("document.documentElement.dataset.cursor=localStorage.getItem('cursor')||'on';", '')
          s = s.replace("$('cursorToggle').checked=document.documentElement.dataset.cursor!=='off';", '')

          # The old canvas marker may have been removed with the cursor section; replace any remaining marker.
          s = s.replace('// Canvas background: particles + home lava-lamp blobs', '// Canvas UI-inspired background + original-style fire/blob mouse trail')
          p.write_text(s)

      - name: Commit result and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Restore fire blob mouse trail and remove old background" || true
          git rm .github/workflows/apply-trail-background-fix.yml || true
          git commit -m "Remove temporary background fix workflow" || true
          git push