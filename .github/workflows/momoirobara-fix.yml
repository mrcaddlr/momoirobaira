name: Momoirobara one-shot repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f momo-fixed.js ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove the two broken/duplicated inline feature blocks and replace them with one stable external module.
          s=re.sub(r'\s*<!-- momoirobara-feature-build-2026-08-20-v4 -->\s*<script id="momo-inline-features">.*?</script>\s*<script id="momo-inline-ui-2026">.*?</script>', '', s, flags=re.S)
          if 'momo-fixed.js' not in s:
              s=s.replace('</body>', '<script src="momo-fixed.js"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html momo-fixed.js
          git rm -f .github/workflows/momoirobara-fix.yml
          git commit -m 'fix: repair Momoirobara UI and feature layer [skip ci]' || exit 0
          git push
