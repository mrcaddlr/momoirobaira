name: Deploy Experimental to GitHub Pages

on:
  push:
    branches:
      - experimental
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-experimental
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout experimental
        uses: actions/checkout@v6
        with:
          ref: experimental
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject experimental lyrics UI and build marker
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          sha = os.environ['BUILD_SHA']
          tag = f'<script type="module" src="./lyrics/experimental-ui.js?v={sha}"></script>'
          marker = f'<meta name="momoirobara-experimental-build" content="{sha}">'
          import re
          text = re.sub(r'<meta name="momoirobara-experimental-build"[^>]*>\s*', '', text)
          text = re.sub(r'<script type="module" src="\./lyrics/experimental-ui\.js(?:\?[^\"]*)?"></script>\s*', '', text)
          if '</head>' in text:
              text = text.replace('</head>', marker + '\n</head>', 1)
          else:
              text = marker + '\n' + text
          if '</body>' in text:
              text = text.replace('</body>', tag + '\n</body>', 1)
          else:
              text += '\n' + tag + '\n'
          p.write_text(text, encoding='utf-8')
          Path('experimental-build.txt').write_text(sha + '\n', encoding='utf-8')
          PY

      - name: Upload experimental site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy experimental site
        id: deployment
        uses: actions/deploy-pages@v4
