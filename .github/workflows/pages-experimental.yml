name: Deploy Experimental to GitHub Pages

on:
  push:
    branches:
      - experimental
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-experimental
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout experimental
        uses: actions/checkout@v6
        with:
          ref: experimental

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject experimental lyrics UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script type="module" src="./lyrics/experimental-ui.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker in text:
                  text = text.replace(marker, tag + '\n' + marker, 1)
              else:
                  text += '\n' + tag + '\n'
              p.write_text(text, encoding='utf-8')
          PY

      - name: Upload experimental site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy experimental site
        id: deployment
        uses: actions/deploy-pages@v4
